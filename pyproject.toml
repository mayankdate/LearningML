[project]
name = "learningml"
version = "0.1.0"
requires-python = ">=3.12"
# Python packages for notebooks 16-20. Scripts 01-15 are R and need none of this.
dependencies = [
    # Data and plotting (all notebooks)
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "pyreadr",                 # reads Data/ml_teaching_data.rds straight from R
    # 16 NLP and 17 embeddings
    "torch",
    "transformers",
    "sentence-transformers",
    "faiss-cpu",
    # 18 generative AI and 20 agentic AI
    "openai",
    "tiktoken",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ipykernel",               # notebook kernel for VS Code / Jupyter
]

# torch from PyPI runs on the CPU on Windows. To use the RTX 4060, uncomment the
# block below, then run `uv lock` and `uv sync` (needs download.pytorch.org).
#
# [tool.uv.sources]
# torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
#
# [[tool.uv.index]]
# name = "pytorch-cu128"
# url = "https://download.pytorch.org/whl/cu128"
# explicit = true
